<!DOCTYPE html>
<html>
<head>
    <title>Keystore Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <h1>Keystore Generator</h1>
    <p>이 도구는 개발용 키스토어를 생성합니다. 실제 배포용으로는 Android Studio를 사용하세요.</p>
    
    <button onclick="generateKeystore()">Generate Keystore</button>
    <div id="result"></div>

    <script>
        function generateKeystore() {
            // 간단한 키스토어 구조 생성 (실제로는 더 복잡함)
            const keystoreData = {
                alias: 'chunwoo-key-alias',
                password: 'chunwoo123',
                keyPassword: 'chunwoo123',
                validity: 10000,
                keySize: 2048,
                algorithm: 'RSA'
            };
            
            // 실제 키스토어 생성은 복잡하므로 안내 메시지
            document.getElementById('result').innerHTML = `
                <h3>키스토어 생성 안내</h3>
                <p>실제 키스토어 생성을 위해서는 다음 중 하나를 사용하세요:</p>
                <ul>
                    <li><strong>Android Studio</strong>: Build → Generate Signed Bundle/APK → Create new keystore</li>
                    <li><strong>Java keytool</strong>: keytool -genkey -v -keystore chunwoo-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias chunwoo-key-alias</li>
                    <li><strong>온라인 도구</strong>: <a href="https://keystore-explorer.org/" target="_blank">KeyStore Explorer</a></li>
                </ul>
                <p><strong>권장 설정:</strong></p>
                <ul>
                    <li>Key store path: android/app/chunwoo-release-key.jks</li>
                    <li>Password: chunwoo123</li>
                    <li>Alias: chunwoo-key-alias</li>
                    <li>Key password: chunwoo123</li>
                </ul>
            `;
        }
    </script>
</body>
</html>
