<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <!-- PWA Meta Tags -->
  <meta name="application-name" content="천우현장관리">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="천우현장관리">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="full-screen" content="yes">
  <meta name="browsermode" content="application">
  <meta name="x5-orientation" content="portrait">
  <meta name="x5-fullscreen" content="true">
  <meta name="x5-page-mode" content="app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-orientations" content="portrait">
  <meta name="description" content="천우현장관리 시스템 - 현장, 일정, 안전관리 통합 시스템">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="msapplication-config" content="/browserconfig.xml">
  <meta name="msapplication-TileColor" content="#181A20">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="theme-color" content="#181A20">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/logo192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/logo512.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icon-152x152.png">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <title>천우현장관리 시스템</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <!-- 한글 폰트 추가 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
  
  <!-- 폰트 로딩 확인 스크립트 -->
  <script>
    // 폰트 로딩 확인
    if ('fonts' in document) {
      Promise.all([
        document.fonts.load('300 16px "Noto Sans KR"'),
        document.fonts.load('400 16px "Noto Sans KR"'),
        document.fonts.load('500 16px "Noto Sans KR"'),
        document.fonts.load('700 16px "Noto Sans KR"'),
        document.fonts.load('400 16px "Nanum Gothic"'),
        document.fonts.load('700 16px "Nanum Gothic"'),
        document.fonts.load('800 16px "Nanum Gothic"'),
        document.fonts.load('400 16px "Nanum Myeongjo"'),
        document.fonts.load('700 16px "Nanum Myeongjo"'),
        document.fonts.load('800 16px "Nanum Myeongjo"')
      ]).then(() => {
        document.documentElement.classList.add('fonts-loaded');
        console.log('한글 폰트 로딩 완료');
      }).catch((error) => {
        console.warn('폰트 로딩 실패:', error);
        // 폰트 로딩 실패 시에도 기본 폰트 사용
        document.documentElement.classList.add('fonts-loaded');
      });
    } else {
      // 폰트 API를 지원하지 않는 브라우저
      document.documentElement.classList.add('fonts-loaded');
    }
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
