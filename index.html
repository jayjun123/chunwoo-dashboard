<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Permissions-Policy" content="microphone=(self), camera=(self), geolocation=(self)" />
    <title>천우 건설현장관리시스템</title>
    <style>
      /* 한글 입력 개선 */
      input, textarea {
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* 모바일 키보드 최적화 */
      @media screen and (max-width: 768px) {
        input, textarea {
          font-size: 16px !important; /* iOS에서 줌 방지 */
        }
      }
      
      /* iPad 뷰포트 진단 */
      @media screen and (min-width: 768px) and (max-width: 1500px) {
        body::before {
          content: "iPad 모드 감지됨";
          position: fixed;
          top: 10px;
          right: 10px;
          background: rgba(0,0,0,0.8);
          color: white;
          padding: 5px 10px;
          border-radius: 4px;
          font-size: 12px;
          z-index: 9999;
          display: none; /* 개발 시에만 표시하려면 block으로 변경 */
        }
      }

    </style>
    <script>
      // 뷰포트 진단 코드
      function diagnoseViewport() {
        const info = {
          innerWidth: window.innerWidth,
          clientWidth: document.documentElement.clientWidth,
          visualViewport: window.visualViewport?.width,
          dpr: window.devicePixelRatio,
          matches: window.matchMedia('(max-width: 1500px)').matches,
          screenWidth: screen.width,
          outerWidth: window.outerWidth
        };
        console.log('뷰포트 진단:', info);
        return info;
      }
      
      // 페이지 로드 시 진단
      window.addEventListener('load', diagnoseViewport);
      
      // 리사이즈 시 진단
      window.addEventListener('resize', diagnoseViewport);
      
      // Visual Viewport API 지원 시
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', diagnoseViewport);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
